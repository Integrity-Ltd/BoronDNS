name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-installer:
    name: Build x86_64 musl artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Check release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["packages"][0]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$version"

      - name: Shell checks
        run: scripts/check-shell-scripts.sh

      - name: Build installer
        run: scripts/package-installer.sh

      - name: Docker installer smoke
        run: scripts/test-installer-docker.sh

      - name: Build Docker image archive
        run: scripts/package-docker-image.sh

      - name: Docker image smoke
        run: scripts/test-docker-image.sh

      - name: Verify static binaries
        run: |
          ldd target/dist/oxidedns-*-x86_64-unknown-linux-musl.bin | tee target/dist/release-binary-ldd.txt
          grep -Eiq 'not a dynamic executable|statically linked' target/dist/release-binary-ldd.txt
          target/dist/oxidedns-*-x86_64-unknown-linux-musl.bin --version
          ldd target/dist/oxidedns-*-x86_64-unknown-linux-musl-oxide-gun.bin | tee target/dist/release-oxide-gun-ldd.txt
          grep -Eiq 'not a dynamic executable|statically linked' target/dist/release-oxide-gun-ldd.txt
          target/dist/oxidedns-*-x86_64-unknown-linux-musl-oxide-gun.bin --version

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: oxidedns-x86_64-unknown-linux-musl
          path: |
            target/dist/oxidedns-*-x86_64-unknown-linux-musl.tar.xz
            target/dist/oxidedns-*-x86_64-unknown-linux-musl.tar.xz.sha256
            target/dist/oxidedns-*-x86_64-unknown-linux-musl.bin
            target/dist/oxidedns-*-x86_64-unknown-linux-musl.bin.sha256
            target/dist/oxidedns-*-x86_64-unknown-linux-musl-oxide-gun.bin
            target/dist/oxidedns-*-x86_64-unknown-linux-musl-oxide-gun.bin.sha256
            target/dist/oxidedns-*-x86_64-unknown-linux-musl-docker-image.tar.xz
            target/dist/oxidedns-*-x86_64-unknown-linux-musl-docker-image.tar.xz.sha256
            target/dist/oxidedns-*-x86_64-unknown-linux-musl-docker-image.manifest.txt
            target/dist/oxidedns-*-x86_64-unknown-linux-musl-docker-image.inspect.json
            target/dist/oxidedns-*-x86_64-unknown-linux-musl/manifest.txt
            target/dist/oxidedns-*-x86_64-unknown-linux-musl/ldd.txt
            target/dist/oxidedns-*-x86_64-unknown-linux-musl/ldd-oxidedns.txt
            target/dist/oxidedns-*-x86_64-unknown-linux-musl/ldd-oxide-gun.txt
            target/dist/oxidedns-*-x86_64-unknown-linux-musl/file.txt
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          notes="target/dist/release-notes-$version.md"
          tarball="target/dist/oxidedns-$version-x86_64-unknown-linux-musl.tar.xz"
          binary="target/dist/oxidedns-$version-x86_64-unknown-linux-musl.bin"
          oxide_gun="target/dist/oxidedns-$version-x86_64-unknown-linux-musl-oxide-gun.bin"
          docker_image="target/dist/oxidedns-$version-x86_64-unknown-linux-musl-docker-image.tar.xz"
          docker_manifest="target/dist/oxidedns-$version-x86_64-unknown-linux-musl-docker-image.manifest.txt"

          cat > "$notes" <<EOF
          OxideDNS $version

          Assets:
          - Installer archive: $(basename "$tarball")
          - Static OxideDNS binary: $(basename "$binary")
          - Static XDP-enabled OxideGun binary: $(basename "$oxide_gun")
          - Docker image archive: $(basename "$docker_image")
          - SHA256 files are attached for the installer, binaries, and Docker image archive.

          Target: x86_64-unknown-linux-musl

          Docker image use:
          xz -dc $(basename "$docker_image") | docker load
          docker run --rm oxidedns:$version --version
          EOF

          gh release create "$tag" \
            --verify-tag \
            --title "OxideDNS $version" \
            --notes-file "$notes" \
            "$tarball" \
            "$tarball.sha256" \
            "$binary" \
            "$binary.sha256" \
            "$oxide_gun" \
            "$oxide_gun.sha256" \
            "$docker_image" \
            "$docker_image.sha256" \
            "$docker_manifest"
