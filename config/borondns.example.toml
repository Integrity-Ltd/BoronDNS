# The primary TOML file must be a regular file no larger than 4 MiB. BoronDNS
# validates and reads one open handle so concurrent growth cannot bypass it.
[server]
# Legacy listen_udp/listen_tcp keys are still accepted. Prefer [interfaces].dns
# for new deployments; if interfaces.dns is omitted, the SRS defaults are
# ["0.0.0.0:53", "[::]:53"] for UDP and TCP.
# Runtime log level. Default: "info".
log_level = "info"
# Runtime log format. Default: "json"; "logfmt" is also SRS-structured.
# "plain" remains a local debugging compatibility format.
log_format = "json"
# Optional NSID response payload. Default: empty, which disables NSID responses.
nsid = "borondns-example"

[process]
# If the process is launched as root for privileged port binding, BoronDNS requires
# a configured unprivileged target and drops to it before processing network
# input. Prefer running directly as this user with CAP_NET_BIND_SERVICE instead.
# run_as_user = "borondns"
# Disable process core dumps during startup so in-memory TSIG/XoT material and
# transferred zone data are not written to crash artifacts. Default: true.
disable_core_dumps = true
# On Linux, set PR_SET_NO_NEW_PRIVS after socket binding and any configured
# privilege drop, before network workers process input. Default: true.
no_new_privileges = true

[interfaces]
# DNS query sockets for both UDP and TCP. These sockets also receive inbound
# NOTIFY from authorized primary addresses. String entries remain accepted, but
# address/name pairs are preferred so future XDP attachment can identify the
# intended NIC by name. The name is accepted and ignored by the current socket
# backend.
dns = [
  { address = "0.0.0.0:5300", name = "dns0" },
  { address = "[::]:5300", name = "dns0" },
]
# Operator-facing interface address. Health and metrics use health.default_port
# on these IP addresses unless health.bind_address/bind_port is set.
mgmt = ["127.0.0.1:9443"]
# Outbound transfer source addresses. Port must be 0 so the OS selects an
# ephemeral source port; one IPv4 and one IPv6 source can be configured.
transfer = ["0.0.0.0:0", "[::]:0"]

[logging]
# Maximum bytes in any single structured log entry. Default: 16384.
max_entry_length_bytes = 16384

[health]
# Explicit health/metrics bind override. When set, this takes precedence over
# interfaces.mgmt and legacy server.health.
bind_address = "127.0.0.1"
bind_port = 8080
# Port used with interfaces.mgmt when bind_address/bind_port is omitted.
default_port = 8080
# Per-source scrape budget for /metrics. Default: 60 requests per minute.
metrics_rate_limit_per_minute = 60
# Idle seconds before a metrics rate-limit bucket can be evicted. Default: 300.
metrics_rate_limit_idle_seconds = 300
# Maximum accepted health/observability HTTP connections across all management
# listeners. Excess accepted connections are closed immediately; idle listeners
# do not reserve capacity. Default: 128.
max_connections = 128

[metrics]
# Prometheus query-latency histogram buckets in seconds. Default:
# [0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.1]
# At most 64 strictly increasing boundaries may be configured.
latency_histogram_buckets = [0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.1]
# "full" keeps detailed query, rcode, latency, and cookie-prefix metrics.
# "reduced" keeps coarse hot-path counters while skipping mutex-backed detail.
# "off" additionally suppresses the coarse hot-path counters; saturation/benchmark only.
hot_path_detail = "full"
# Disabled by default. Enable only for benchmark captures that need pipeline
# stage timings or response-cache candidacy counters.
pipeline_timing_enabled = false
# Disabled by default because scrape-time zone-shape gauges and histograms walk
# active zone snapshots. Enable only for memory-layout diagnostics.
zone_shape_enabled = false
[query]
# ANY response policy. Default: "minimal"; "full" returns ordinary owner RRsets.
any_response = "minimal"

[zone_publication]
# "auto" keeps compact ZoneImage publication for smaller zones and switches
# large zones to structurally shared IXFR overlays. "compact" always rebuilds
# the whole query image; "sharded" uses overlays after the initial publication.
strategy = "auto"
# Auto mode starts using incremental overlays at this RRset count. The default
# preserves the existing compact hot path for ordinary zones.
sharded_rrset_threshold = 1000000
# Rebuild a compact base in a blocking background worker after this many
# distinct owners have changed since the last compact base. Set to 0 to disable
# automatic compaction for externally managed maintenance windows.
overlay_compaction_dirty_owner_threshold = 100000

[edns]
# Extended DNS Errors per RFC 8914. Default: "off". Use "minimal" to include
# diagnostic EDE codes for selected operational states, without extra text.
extended_dns_errors = "off"

[chaos]
# Optional CH/TXT self-identification. Empty values make version.bind. and
# version.server. REFUSED. hostname.bind. and id.server. fall back to printable
# [server].nsid when hostname is empty.
version = ""
hostname = ""

[dnssec]
# Maximum NSEC3 iterations accepted when composing negative DNSSEC proofs.
# Default: 100, the legacy soft ceiling from RFC 9276 / BCP 236.
nsec3_max_iterations = 100

[cookie]
# policy = "lenient" accepts normal first responses and returns a fresh server
# cookie. Use "strict" to require retry with a valid server cookie, or
# "disabled" to omit DNS Cookie processing.
policy = "lenient"
timestamp_past_tolerance_seconds = 3600
timestamp_future_tolerance_seconds = 300
# 0 keeps the secret for the process lifetime; non-zero enables in-process
# periodic regeneration without persisting secret material. For anycast or
# load-balanced deployments, configure the same 32-hex-character server_secret
# on every instance. During staged rollover, deploy the new value as
# server_secret and the old value as previous_server_secret. Do not combine a
# configured server_secret with secret_rotation_interval_secs.
# server_secret = "00112233445566778899aabbccddeeff"
# previous_server_secret = "ffeeddccbbaa99887766554433221100"
secret_rotation_interval_secs = 0

[rrl]
# Enable UDP response-rate limiting. Default: true.
enabled = true
# Source prefix lengths used for RRL accounting. Defaults: 24 and 56.
ipv4_prefix_len = 24
ipv6_prefix_len = 56
# Per-category UDP response rates, in responses per second.
positive_per_second = 20
nxdomain_per_second = 5
nodata_per_second = 10
referral_per_second = 10
error_per_second = 5
# Slip value for limited UDP responses. Default: 2.
slip = 2
# Maximum tracked RRL accounting keys. Default: 100000.
max_keys = 100000
# Interval for aggregate RRL summary logs. Default: 60 seconds.
summary_log_interval_secs = 60
# Source prefixes exempt from RRL. Default: empty.
allowlist = []

[tsig]
# Default from RFC 8945 guidance. Values above 60 seconds are accepted but
# reported as suspicious configuration warnings.
fudge_seconds = 300

[transfer]
# Refuse startup if any static zone lacks tsig_key. Catalog zones have a
# separate mandatory-TSIG policy in production catalog mode.
require_tsig = false

[limits]
# Runtime duration settings (`*_secs` and `*_seconds`) are capped at one year
# (31536000 seconds) across limits, RRL, health/observability, cookie rotation,
# and control-plane polling/timeouts so every monotonic deadline is representable.
# EDNS UDP payload ceiling. Default: 1232.
max_udp_payload = 1232
# UDP datagrams to drain per standard socket readiness wakeup, or per Linux
# recvmmsg/sendmmsg batch when udp_runtime = "dedicated". Valid range: 1..=1024.
# Default: 1, preserving one-datagram-at-a-time behavior; raise only with
# retained benchmark evidence for the target host.
udp_batch_size = 1
# Standard UDP SO_REUSEPORT worker sockets per configured UDP listener.
# Valid range: 1..=64. Default: 1. Raise only with retained local or physical
# benchmark evidence.
udp_reuseport_workers = 1
# Standard UDP runtime. "tokio" preserves the stable async socket path;
# "dedicated" uses one blocking OS thread per UDP worker for data-plane
# experiments and later AF_XDP-shaped worker ownership.
udp_runtime = "tokio"
# Dedicated UDP idle behavior. "park" is the conservative default, while
# "spin" keeps polling continuously for saturation benchmarks.
udp_idle_strategy = "park"
# Optional Linux CPU affinity list for dedicated standard UDP workers. Length
# must match udp_reuseport_workers and requires udp_runtime = "dedicated".
# Leave unset unless benchmark evidence justifies it.
# udp_worker_cpu_affinity = [0, 1, 2, 3]
# Maximum followed CNAME/DNAME chain depth. Default: 8.
max_cname_chain = 8
# TCP idle/read/write timeout seconds. Defaults: 30 seconds each.
tcp_idle_timeout_secs = 30
tcp_read_timeout_secs = 30
tcp_write_timeout_secs = 30
# Outbound TCP connection-establishment timeout. Default: 10 seconds.
tcp_connect_timeout_secs = 10
# Global accepted TCP connection limit. Default: 1024.
max_tcp_connections = 1024
# Optional per-source-IP TCP connection cap. Default: unset, no per-source cap.
#max_tcp_connections_per_source = 128
# Per-connection DNS-over-TCP in-flight query limit. Default: 64. Values above
# the platform's Tokio bounded-primitive capacity are rejected at startup.
max_tcp_inflight_queries_per_connection = 64
# Seconds a connection may remain at the in-flight limit before FIN close.
# Omit to use tcp_read_timeout_secs.
#tcp_inflight_limit_timeout_secs = 30
# Graceful shutdown drain budget. Default: 30 seconds.
graceful_shutdown_secs = 30
# EDNS padding block size. Must remain 0 in this release: client queries are
# served only over plaintext UDP/TCP, where RFC 7830 forbids response padding.
# A nonzero value is rejected until an encrypted client-query listener exists.
edns_padding_block_size = 0
# AXFR and IXFR session timeouts. Defaults: 300 and 60 seconds.
axfr_timeout_secs = 300
ixfr_timeout_secs = 60
# Cooldown after IXFR is found unsupported. Default: 3600 seconds.
ixfr_disabled_cooldown_secs = 3600
# Per-session AXFR/IXFR cumulative received payload cap. The runtime's aggregate
# guard is derived as this value times max_concurrent_transfers, so concurrent
# sessions do not compete for one session's allowance. Default: 4 GiB.
max_transfer_ingest_bytes = 4294967296
# Per-session AXFR/IXFR DNS message-count cap. This separately bounds streams
# made from many small messages. Raise it deliberately for synthetic large-zone
# tests alongside max_transfer_ingest_bytes. Default: 4096.
max_transfer_ingest_messages = 4096
# Per-zone accepted NOTIFY deduplication window. Default: 1 second.
notify_dedup_secs = 1
# Window for rate-limited unauthorized/TSIG-failed NOTIFY warning logs. Default: 60 seconds.
notify_log_rate_window_secs = 60

# Maximum concurrent transfer sessions. Default: 4.
max_concurrent_transfers = 4
# Effective SOA REFRESH/RETRY scheduling bounds and initial-load retry policy.
zsm_min_interval_secs = 60
zsm_max_interval_secs = 86400
zsm_initial_retry_secs = 60
zsm_initial_retry_max_secs = 3600
# Long-LOADING warning threshold and repeat interval. Default: 3600 seconds.
zsm_loading_warning_threshold_secs = 3600

#[xdp]
# Experimental AF_XDP backend controls. These are used only when
# limits.udp_backend = "af_xdp". Every UDP listener must use a concrete local
# IP address in this mode; wildcard 0.0.0.0/[::] binds are rejected because XDP
# runs before the kernel's local-destination routing decision.
#interface = "eth0"
#redirect_object = "/path/to/borondns-xdp-redirect.bpf.o"
#queue_id = 0
# Optional sparse AF_XDP queue list. Queue IDs must be in 0..=63 and the list
# may contain at most 64 unique entries, matching the shipped redirect map.
# Leave unset for the contiguous queue range starting at queue_id. Do not set
# queue_id and queue_ids together.
#queue_ids = [0, 1, 2, 3]
# Per-queue packet memory and rings. Defaults are 4096 UMEM frames,
# 1024 RX/TX entries, 2048 fill entries, 1024 completion entries, and a batch
# of 64. Validation caps UMEM frames at 262144, every ring at 65536, and the
# effective batch at 1024. The conservative aggregate estimate across all
# effective queues must remain at or below 32 GiB.
#umem_frame_count = 4096
#rx_ring_size = 1024
#tx_ring_size = 1024
#fill_ring_size = 2048
#completion_ring_size = 1024
#batch_size = 64
# Bound consecutive RX dequeues before publishing a partial batch or yielding
# reject-only traffic. Default: 1.
#rx_drain_passes = 1
# The current xdp crate enables XDP_USE_NEED_WAKEUP but does not expose the
# kernel ring needs-wakeup flag. BoronDNS therefore requires 1 and kicks every
# non-empty TX enqueue so an isolated response cannot remain stranded.
#tx_wakeup_interval = 1

#[control_plane.telemetry]
# Optional uDNS node telemetry callback. When configured, BoronDNS reports
# transfer success/current/failure state to uDNS using the node-scoped API token.
#endpoint_url = "https://udns.example.internal/api/v1"
# Development tests may explicitly set allow_insecure_loopback_http = true,
# but only IP-literal loopback HTTP endpoints are accepted in that mode.
#allow_insecure_loopback_http = false
#node_id = "00000000-0000-0000-0000-000000000000"
#bearer_token = "udns-node-token"
#timeout_secs = 5

#[control_plane.operations]
# Optional uDNS operation polling. This keeps BoronDNS secondary-only and
# static-config based while allowing uDNS to drive durable node commands.
#enabled = true
#endpoint_url = "https://udns.example.internal/api/v1"
# Development tests may explicitly set allow_insecure_loopback_http = true,
# but only IP-literal loopback HTTP endpoints are accepted in that mode.
#allow_insecure_loopback_http = false
#node_id = "00000000-0000-0000-0000-000000000000"
#bearer_token = "udns-node-token"
#poll_interval_secs = 5
#lease_seconds = 300
#timeout_secs = 5

#[secret_store]
# Optional Unix-only reloadable plaintext filesystem secret snapshot. BoronDNS reads
# <path>/secrets.toml at startup and when a control-plane rotate_tsig or
# republish_feed operation requests a reload. The snapshot may define
# [[tsig_keys]] and [[xot_profiles]] entries; catalog data and zone config
# reference those names only. Paths in secrets.toml must be normalized relative
# paths. BoronDNS captures the root directory once per reload, so an atomic
# `current` symlink switch selects one complete immutable generation. Files must
# be regular, group/world write bits are rejected, final-component and nested
# symlinks are rejected, and secret-bearing files must not be world-readable.
# Non-Unix builds reject [secret_store] because the required descriptor-relative,
# no-follow traversal guarantees are unavailable.
# The manifest is limited to 1 MiB and each referenced key/certificate file to
# 4 MiB. A merged snapshot accepts at most 1024 TSIG keys, 4 MiB of encoded
# TSIG material, and 3 MiB decoded. Repeated file references count each use.
# Both metadata and the actual bounded reads enforce these limits.
#path = "/etc/borondns/secrets.d/current"

[[zones]]
# Zone apex in absolute DNS name form.
name = "example.test."
# DNS class. Default: "IN".
class = "IN"
# Plain TCP transfer primaries. Use transfer_primaries for per-primary settings.
primaries = ["192.0.2.53:53"]
# Extra NOTIFY source IP addresses authorized for this zone.
notify_sources = ["192.0.2.53"]
#tsig_key = "transfer-key."

# For per-primary transfer transport settings, replace primaries with explicit
# transfer_primaries entries. Plain TCP remains the default transport.
#[[zones.transfer_primaries]]
#addr = "192.0.2.53:53"
#transport = "tcp"

# XoT transfer targets are schema-validated during config parsing and their TLS
# file references are validated before runtime listeners bind.
#[[zones.transfer_primaries]]
#addr = "192.0.2.53:853"
#transport = "xot"
#server_name = "primary.example.test"
#trust_anchors = ["/etc/borondns/xot-ca.pem"]
# Or set xot_profile to resolve trust/client material from [secret_store].
#xot_profile = "default-xot"
#client_cert = "/etc/borondns/xot-client.pem"
# Use exactly one of client_key or client_key_pem when client_cert is set.
# Each direct certificate, trust-anchor, key file, or inline key is capped at 4 MiB.
#client_key = "/etc/borondns/xot-client.key"
#client_key_pem = "<inline PEM private key>"

#[[catalog_zones]]
# RFC 9432 catalog zone transferred from a trusted primary. Member zones are
# discovered from PTR records below zones.<catalog-zone>. By default, members
# inherit this catalog's transfer primaries, TSIG key, NOTIFY source policy, and
# transfer limits. Use catalog_* and member_* fields to transfer the catalog
# from one managed primary while transferring members from another content
# primary.
#name = "catalog.example.test."
#class = "IN"
#primaries = ["192.0.2.53:53"]
#notify_sources = ["192.0.2.53"]
# Catalog transfers must be TSIG-authenticated.
#tsig_key = "transfer-key."
# Split-policy example:
#catalog_primaries = ["192.0.2.10:53"]
#member_primaries = ["198.51.100.53:53"]
#catalog_tsig_key = "catalog-transfer-key."
#member_tsig_key = "member-transfer-key."
# Default: false. Transfer and process the catalog but do not serve the catalog
# zone itself on the public DNS query interface.
#serve_catalog_zone = false
# Default: false. When true, accept optional per-member transfer metadata from
# primaries.ext.<member>, _udns-xfr.<member>, and _udns-notify.<member> catalog
# records. This carries addresses, ports, transport, server_name, TSIG key
# names, and NOTIFY sources only; TSIG secrets and TLS trust material stay in
# static config or the reloadable secret store.
#member_transfer_extensions = false
# Local policy for catalog-derived member transfers. Default unsigned_axfr =
# "deny" preserves member TSIG inheritance from member_tsig_key or tsig_key.
# Set "allow-legacy-private" only for explicitly trusted private primary
# addresses that cannot yet serve TSIG/XoT; BoronDNS rejects unsigned member
# AXFR to non-private primary addresses, and catalog transfers themselves still
# require TSIG.
#[catalog_zones.member_transfer_policy]
#unsigned_axfr = "deny"
# Default: 10000. Cap catalog-derived member zones accepted from this catalog.
#max_member_zones = 10000

#[[tsig_keys]]
#name = "transfer-key."
#algorithm = "hmac-sha256" # also supports "hmac-sha1", "hmac-sha384", "hmac-sha512"
# Use exactly one of secret or secret_file. Secret files must be regular files
# readable by the server process, must not be world-readable, and must not be
# group- or world-writable. On Unix, a final-component symlink is rejected.
# Legacy static secret_file content is capped at 64 KiB.
#secret = "c2VjcmV0LWtleQ=="
#secret_file = "/etc/borondns/tsig-transfer-key.secret"

# Example /etc/borondns/secrets.d/current/secrets.toml:
#
#[[tsig_keys]]
#name = "customer-transfer-key."
#algorithm = "hmac-sha256"
#secret_file = "tsig/customer-transfer-key.secret"
#
#[[xot_profiles]]
#name = "default-xot"
#trust_anchors = ["xot/ca.pem"]
#client_cert = "xot/client.pem"
#client_key = "xot/client.key"
