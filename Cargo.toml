[workspace]
resolver = "3"
members = [
  "crates/oxidedns-core",
  "crates/oxidedns-server",
  "crates/oxidedns-cli",
  "crates/oxide-gun",
]
exclude = ["fuzz", "crates/oxide-gun-ebpf", "crates/oxidedns-server-ebpf"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
version = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[workspace.dependencies]
anyhow = "1.0.103"
arc-swap = "1.7"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
http-body = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
siphasher = "1.0.3"
smallvec = "1.15"
subtle = "2.6"
thiserror = "2"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
x509-parser = "0.18.1"
zeroize = "1.8"
rcgen = "0.14.8"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
