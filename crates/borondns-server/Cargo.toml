[package]
name = "borondns-server"
build = "build.rs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
arc-swap.workspace = true
aya = { version = "0.13.1", optional = true }
axum.workspace = true
http-body.workspace = true
flate2.workspace = true
getrandom.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
zeroize.workspace = true
borondns-core = { path = "../borondns-core", version = "1.0.1" }
xdp = { version = "0.7.3", optional = true }
x509-parser.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process", "thread"] }

[features]
default = []
af-xdp = ["dep:aya", "dep:xdp"]
experimental-xdp-time-turn = ["af-xdp"]
experimental-xdp-conditional-wakeup = ["af-xdp"]
experimental-static-redirect = ["af-xdp"]
experimental-xdp-group-loop = ["experimental-response-writer"]
experimental-xdp-busy-poll = ["af-xdp"]
experimental-staged-serving = ["borondns-core/experimental-staged-serving"]
experimental-packed-serving = ["experimental-staged-serving", "borondns-core/experimental-packed-serving"]
experimental-batch-authority = ["experimental-packed-serving", "borondns-core/experimental-batch-authority"]
experimental-fused-serving = ["experimental-batch-authority", "borondns-core/experimental-fused-serving"]
experimental-dense-answers = ["experimental-fused-serving", "borondns-core/experimental-dense-answers"]
experimental-compact-a-answers = ["experimental-dense-answers", "borondns-core/experimental-compact-a-answers"]
experimental-compact-fused-keys = ["experimental-fused-serving", "borondns-core/experimental-compact-fused-keys"]
experimental-direct-buckets = ["experimental-fused-serving", "borondns-core/experimental-direct-buckets"]
experimental-query-preparation = ["experimental-fused-serving", "borondns-core/experimental-query-preparation"]
experimental-response-writer = ["af-xdp", "experimental-fused-serving", "borondns-core/experimental-response-writer"]
experimental-directory-shards = ["borondns-core/experimental-directory-shards"]
experimental-freshness-batching = []
experimental-refresh-pull = []
fuzzing = []

[dev-dependencies]
borondns-core = { path = "../borondns-core", version = "1.0.1", features = ["test-support"] }
rcgen.workspace = true

[lints.rust]
unsafe_code = "allow"
