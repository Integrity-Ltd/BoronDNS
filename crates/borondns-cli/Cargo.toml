[package]
name = "borondns-cli"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "borondns"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
borondns-core = { path = "../borondns-core", version = "1.0.1" }
borondns-server = { path = "../borondns-server", version = "1.0.1" }

[dev-dependencies]
getrandom.workspace = true
rcgen.workspace = true

[features]
default = []
af-xdp = ["borondns-server/af-xdp"]
experimental-compact-serving = ["borondns-core/experimental-compact-serving"]
experimental-serving-directory = ["borondns-core/experimental-serving-directory"]
experimental-xdp-time-turn = ["borondns-server/experimental-xdp-time-turn"]
experimental-xdp-conditional-wakeup = ["borondns-server/experimental-xdp-conditional-wakeup"]
experimental-static-redirect = ["borondns-server/experimental-static-redirect"]
experimental-xdp-group-loop = ["borondns-server/experimental-xdp-group-loop"]
experimental-xdp-busy-poll = ["borondns-server/experimental-xdp-busy-poll"]
experimental-selected-query = ["borondns-core/experimental-selected-query"]
experimental-staged-serving = ["borondns-server/experimental-staged-serving"]
experimental-packed-serving = ["borondns-server/experimental-packed-serving"]
experimental-batch-authority = ["borondns-server/experimental-batch-authority"]
experimental-fused-serving = ["borondns-server/experimental-fused-serving"]
experimental-dense-answers = ["borondns-server/experimental-dense-answers"]
experimental-compact-a-answers = ["borondns-server/experimental-compact-a-answers"]
experimental-compact-fused-keys = ["borondns-server/experimental-compact-fused-keys"]
experimental-direct-buckets = ["borondns-server/experimental-direct-buckets"]
experimental-query-preparation = ["borondns-server/experimental-query-preparation"]
experimental-response-writer = ["borondns-server/experimental-response-writer"]
experimental-directory-shards = ["borondns-server/experimental-directory-shards"]
experimental-freshness-batching = ["borondns-server/experimental-freshness-batching"]
experimental-refresh-pull = ["borondns-server/experimental-refresh-pull"]

[lints]
workspace = true
